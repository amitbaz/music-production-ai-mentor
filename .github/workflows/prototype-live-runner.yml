# PROTOTYPE (mentor-kb #43): does Live run one eval on a GitHub-hosted macOS runner at all?
# Throwaway, on the prototype/live-on-hosted-runner branch only. Runs on every push to that branch
# (GitHub lists workflow_dispatch workflows only from the default branch; an empty commit reruns it).
#
# evals/prototype/live-runner/Preferences.cfg was taken from the mentor-sandbox Tart image (user admin,
# Live 12 Suite, MusicMentor chosen as the first Control Surface, nothing else set), so Live loads the
# Remote Script at launch without anyone opening Settings.
name: prototype-live-runner

on:
  push:
    branches: [prototype/live-on-hosted-runner]
  workflow_dispatch:

jobs:
  live:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CASE: low-end-hot-told
      LIVE_VERSION: "12.4.6"
      LIVE_APP: /Applications/Ableton Live 12 Suite.app
      PATIENCE: /Applications/Ableton Live 12 Suite.app/Contents/App-Resources/Core Library/Lessons/Demo Songs/Chuck Sutton - Patience (Live 12 Suite Demo).als
      SHOTS: ${{ github.workspace }}/shots
    steps:
      - name: The runner
        run: |
          mkdir -p "$SHOTS"
          sw_vers; uname -m; echo "user: $(whoami), console: $(stat -f %Su /dev/console)"
          sysctl hw.memsize hw.ncpu
          df -h /
          system_profiler SPAudioDataType || true

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Live from the CDN (mounted from the URL, never stored)
        run: |
          url="https://cdn-downloads.ableton.com/channels/$LIVE_VERSION/ableton_live_suite_${LIVE_VERSION}_universal.dmg"
          t0=$SECONDS
          # yes answers the licence prompt; the EULA text itself goes to /dev/null
          yes 2>/dev/null | hdiutil attach -nobrowse -readonly -noverify -noautoopen -mountpoint /Volumes/Live "$url" >/dev/null
          echo "mounted in $((SECONDS - t0))s"
          ls -la /Volumes/Live
          t1=$SECONDS
          # find exits 1 on the unreadable .Trashes even when it found the app
          src=$(find /Volumes/Live -maxdepth 2 -name 'Ableton Live*.app' -print -quit 2>/dev/null || true)
          [ -n "$src" ] || { echo "no Ableton Live .app on the installer"; exit 1; }
          ditto "$src" "$LIVE_APP" || sudo ditto "$src" "$LIVE_APP"
          echo "copied in $((SECONDS - t1))s"
          hdiutil detach /Volumes/Live || true
          xattr -dr com.apple.quarantine "$LIVE_APP" 2>/dev/null || true
          df -h /
          [ -f "$PATIENCE" ] || { echo "Patience is not inside the app"; exit 1; }
          codesign -dv "$LIVE_APP" 2>&1 | grep -E 'TeamIdentifier|^Identifier' || true
          echo "- Live install: $((SECONDS - t0))s (mount $((t1 - t0))s, copy $((SECONDS - t1))s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Seed Live's preferences (MusicMentor Control Surface, no updates, no usage data)
        run: |
          prefs="$HOME/Library/Preferences/Ableton/Live $LIVE_VERSION"
          mkdir -p "$prefs"
          printf -- '-_DisableAutoUpdates\n-_DisableSnowplow\n' > "$prefs/Options.txt"
          cp evals/prototype/live-runner/Preferences.cfg "$prefs/Preferences.cfg"
          ls -la "$prefs"

      - name: Install the Remote Script, paired with a fresh password
        run: |
          password=$(cd evals && node --input-type=module -e '
              import { installRemoteScript } from "@mentor/tools/daws/ableton";
              console.log((await installRemoteScript(process.argv[1])).password);
          ' "$HOME/Music/Ableton/User Library/Remote Scripts")
          [ -n "$password" ] || { echo "pairing gave no password"; exit 1; }
          echo "::add-mask::$password"
          echo "ABLETON_PASSWORD=$password" >> "$GITHUB_ENV"
          ls "$HOME/Music/Ableton/User Library/Remote Scripts/MusicMentor"

      - name: Open Patience, click through Live's dialogs, wait for the Remote Script
        run: |
          mkdir -p "$SHOTS"
          t0=$SECONDS
          open -a "$LIVE_APP" "$PATIENCE"
          listening=""
          quiet=0
          for _ in $(seq 1 48); do
              sleep 5
              now=$((SECONDS - t0))
              pgrep -x Live >/dev/null || { echo "Live is not running at ${now}s"; break; }
              screencapture -x "$SHOTS/launch-$(printf %03d "$now")s.png" || true
              echo "--- ${now}s"
              # Live's dialogs, seen through System Events as buttons of a window or of its groups (run 3
              # showed "UI elements of" sees nothing). One click per pass: a demo-mode button, else
              # "Authorize later" (the unauthorized welcome dialog), else a lone OK (audio-device errors).
              out=$(osascript - <<'AS' 2>&1 || true)
          on s(v)
              try
                  return v as text
              on error
                  return "?"
              end try
          end s
          tell application "System Events" to tell process "Live"
              set out to ""
              set chosen to missing value
              set rank to 0
              repeat with w in windows
                  set bs to buttons of w
                  repeat with g in groups of w
                      set bs to bs & (buttons of g)
                  end repeat
                  set out to out & "window [" & my s(name of w) & "] buttons: "
                  repeat with b in bs
                      set d to my s(description of b)
                      set out to out & "[" & d & "] "
                      if d contains "demo" and rank < 3 then
                          set chosen to b
                          set rank to 3
                      else if d contains "Authorize later" and rank < 2 then
                          set chosen to b
                          set rank to 2
                      else if d is "OK" and rank < 1 then
                          set chosen to b
                          set rank to 1
                      end if
                  end repeat
                  set out to out & linefeed
              end repeat
              if chosen is not missing value then
                  set out to out & "CLICKED [" & my s(description of chosen) & "]" & linefeed
                  click chosen
              end if
              return out
          end tell
          AS
              printf '%s\n' "$out" | sed 's/^/  ui: /'
              log=$(echo "$HOME/Library/Preferences/Ableton/"Live*/Log.txt)
              if [ -z "$listening" ] && [ -f "$log" ] && grep -q "listening on 127.0.0.1:39031" "$log"; then
                  listening=$now
                  echo "Remote Script listening at ${listening}s"
              fi
              # Once the script listens, keep clearing dialogs until a pass clicks nothing.
              if [ -n "$listening" ]; then
                  case "$out" in *CLICKED*) quiet=0 ;; *) quiet=$((quiet + 1)) ;; esac
                  [ "$quiet" -ge 1 ] && break
              fi
          done
          screencapture -x "$SHOTS/launch-end.png" || true
          log=$(echo "$HOME/Library/Preferences/Ableton/"Live*/Log.txt)
          echo "--- Log.txt lines about scripts, licensing, audio and the document"
          grep -iE 'MidiRemoteScript 1|AbletonJS|demo|Licens|Message Box|Loading document|End ExchangeDocument' "$log" 2>/dev/null | grep -v lagging | tail -40 || echo "no Log.txt at $log"
          echo "- Remote Script listening: ${listening:-never}s from launch" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$listening" ] || { echo "::error::the Remote Script never listened"; exit 1; }
          grep -q "Loading document .*Patience" "$log" || { echo "::error::Patience never loaded"; exit 1; }

      - name: Run one eval against the runner's Live
        env:
          EVAL_SANDBOX: host
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          t0=$SECONDS
          status=0
          pnpm eval "$CASE" --runs 1 --no-kb 2>&1 | tee eval.log || status=$?
          echo "- eval: exit $status in $((SECONDS - t0))s" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^run 1|passed|Stopped|failed' eval.log | sed 's/^/  - /' >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

      - name: Last look
        if: always()
        run: |
          mkdir -p "$SHOTS"
          screencapture -x "$SHOTS/final.png" || true
          pgrep -lx Live || echo "Live is not running"
          mkdir -p artifacts
          cp "$HOME"/Library/Preferences/Ableton/Live*/Log.txt artifacts/ 2>/dev/null || echo "no Log.txt"
          cp -R "$HOME/.mentor/evals/runs" artifacts/runs 2>/dev/null || echo "no runs"
          cp eval.log artifacts/ 2>/dev/null || true
          df -h /

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-live-runner
          path: |
            shots
            artifacts
          if-no-files-found: warn
